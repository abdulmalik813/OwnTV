name: Build

# Assembles the APK only — no unit tests, no lint, no release publishing.
# Runs on every push to the customization branch and on pull requests targeting it.
on:
  push:
    branches: [ customization ]
  pull_request:
    branches: [ customization ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStandardDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: owntv-customization-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
